name: Playwright Tests CI/CD

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore: [ '**.md', '.gitignore' ]
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore: [ '**.md', '.gitignore' ]
  schedule:
    # Nightly run at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# Cancel a run when a newer push lands on the same branch/PR, so we
# never burn minutes testing a commit that's already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; jobs that push to gh-pages elevate this
# explicitly below.
permissions:
  contents: read

jobs:
  smoke-tests:
    name: Smoke Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npx playwright test --grep "@smoke"

      - name: Upload artifacts
        if: always()
        uses: ./.github/actions/upload-test-artifacts
        with:
          suite-name: smoke

  regression-tests:
    name: Regression Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npx playwright test --grep "@regression"

      - name: Upload artifacts
        if: always()
        uses: ./.github/actions/upload-test-artifacts
        with:
          suite-name: regression

  e2e-tests:
    name: E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests (shard ${{ matrix.shard }}/3)
        run: npx playwright test --grep-invert "@smoke|@regression|@country" --shard=${{ matrix.shard }}/3

      - name: Upload artifacts
        if: always()
        uses: ./.github/actions/upload-test-artifacts
        with:
          suite-name: e2e-${{ matrix.shard }}

  country-tests:
    name: Country Checks (${{ matrix.country }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    strategy:
      fail-fast: false
      matrix:
        include:
          - country: us
            base_url: https://www.dell.com/en-us
          - country: uk
            base_url: https://www.dell.com/en-uk
          - country: de
            base_url: https://www.dell.com/de-de
          - country: in
            base_url: https://www.dell.com/en-in
          - country: au
            base_url: https://www.dell.com/en-au

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run country checks (${{ matrix.country }})
        env:
          BASE_URL: ${{ matrix.base_url }}
          COUNTRY: ${{ matrix.country }}
        run: npx playwright test tests/country-check.spec.ts --grep "@country"

      - name: Upload artifacts
        if: always()
        uses: ./.github/actions/upload-test-artifacts
        with:
          suite-name: country-${{ matrix.country }}

  publish-report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, e2e-tests, country-tests]
    if: always()
    # Serialized with allure-report: both push to gh-pages, and running
    # them concurrently risks one push clobbering the other's commit.
    concurrency:
      group: gh-pages-publish-${{ github.ref }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: report-${{ github.run_number }}

      - name: Publish test summary
        run: |
          echo "## 📊 Playwright Test Report" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 View Report Online:" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Full HTML Report](https://venu-madhav-mahadevu.github.io/Test_Scripts/report-${{ github.run_number }}/index.html)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Download Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- blob-report-smoke, blob-report-regression, blob-report-e2e-1..3" >> $GITHUB_STEP_SUMMARY
          echo "- test-results-smoke, test-results-regression, test-results-e2e-1..3" >> $GITHUB_STEP_SUMMARY

  email-report:
    name: Email Test Report
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, e2e-tests, country-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download JSON reports
        uses: actions/download-artifact@v4
        with:
          pattern: json-report-*
          path: json-reports
          merge-multiple: true

      - name: Build HTML table
        run: node scripts/build-email-report.js json-reports email-report.html

      - name: Send report email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Playwright Test Report - Run #${{ github.run_number }} (smoke: ${{ needs.smoke-tests.result }}, regression: ${{ needs.regression-tests.result }}, e2e: ${{ needs.e2e-tests.result }})"
          to: ${{ vars.REPORT_EMAIL_TO || secrets.MAIL_USERNAME }}
          from: Playwright CI <${{ secrets.MAIL_USERNAME }}>
          html_body: file://email-report.html

  allure-report:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, e2e-tests, country-tests]
    if: always()
    # Serialized with publish-report — see note above.
    concurrency:
      group: gh-pages-publish-${{ github.ref }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Get previous Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        uses: simple-elf/allure-report-action@v1.15
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Strip nested git metadata from report
        if: always()
        run: rm -rf allure-history/.git

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          destination_dir: allure

      - name: Publish Allure report link
        if: always()
        run: |
          echo "### 📊 Allure Report:" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Allure Report](https://venu-madhav-mahadevu.github.io/Test_Scripts/allure/index.html)" >> $GITHUB_STEP_SUMMARY
